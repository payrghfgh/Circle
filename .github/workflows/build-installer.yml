name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Circle for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check the sources compile
        run: python -m compileall -q .

      - name: Freeze with PyInstaller
        run: python -m PyInstaller Circle.spec --noconfirm --clean

      - name: Check the app was produced
        run: |
          if (-not (Test-Path "dist\Circle\Circle.exe")) { throw "dist\Circle\Circle.exe missing" }
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\Circle.iss"
          if (-not (Test-Path "installer\output\Circle-1.1.0-setup.exe")) { throw "installer missing" }
        shell: pwsh

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Circle-windows-installer
          path: installer/output/Circle-*-setup.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/Circle-*-setup.exe
          generate_release_notes: true
